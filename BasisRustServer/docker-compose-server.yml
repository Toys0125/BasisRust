services:
  # Compose may create fresh bind-mount directories as root. Prepare only the
  # server's persistent directories before starting its unprivileged process.
  basis-rust-server-permissions:
    image: alpine:3.20
    user: "0:0"
    network_mode: none
    command: ["sh", "-c", "chown -R 10001:10001 /config /logs"]
    volumes:
      - ./config:/config
      - ./logs:/logs

  basis-rust-server:
    build: .
    depends_on:
      basis-rust-server-permissions:
        condition: service_completed_successfully
    environment:
      SetPort: 4296
      EnableConsole: "false"
      Password: default_password
    ports:
      - "4296:4296/udp"
      - "10666:10666/tcp"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
