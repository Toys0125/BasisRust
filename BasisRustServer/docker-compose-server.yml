services:
  basis-rust-server:
    build: .
    environment:
      SetPort: 4296
      EnableConsole: "false"
      BASIS_SERVER_PASSWORD: ${BASIS_SERVER_PASSWORD:?Set a non-empty server password}
    ports:
      - "4296:4296/udp"
      - "10666:10666/tcp"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
