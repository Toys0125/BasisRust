[package]
name = "basis-server-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
sql-storage = ["dep:sqlx", "dep:tokio"]

[dependencies]
anyhow.workspace = true
basis-protocol = { path = "../basis-protocol" }
sha2.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite"], optional = true }
tokio = { workspace = true, optional = true }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
xattr = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Authorization"] }
