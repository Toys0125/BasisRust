crossterm.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc = "0.1.52"
rustyline.workspace = true

[target.'cfg(windows)'.dependencies]
rayon.workspace = true
