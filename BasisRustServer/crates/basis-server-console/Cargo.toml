[package]
name = "basis-server-console"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gpu = ["basis-server-core/gpu"]

[[bin]]
name = "basis-server-console"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
basis-protocol = { path = "../basis-protocol" }
basis-server-core = { path = "../basis-server-core" }
basis-server-health = { path = "../basis-server-health" }
clap.workspace = true
crossterm.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc = "0.1.52"
rayon.workspace = true
rustyline.workspace = true

# Keep warmed sparse heaps from regrowing RSS through huge-page promotion.
# no_thp also compiles out allocator huge-page allocation hints.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1.52", features = ["no_thp"] }
