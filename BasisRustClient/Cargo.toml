[workspace]
resolver = "2"
members = [".", "crates/basis-client-core"]
default-members = [".", "crates/basis-client-core"]

[package]
name = "basis-rust-client"
version = "0.1.0"
edition = "2021"

[features]
default = ["windows-mimalloc"]
# Match the Windows server allocator; Linux keeps its existing allocator.
windows-mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow = "1"
basis-client-core = { path = "crates/basis-client-core" }
clap = { version = "4", features = ["derive"] }
num_cpus = "1"
tokio = { version = "1", features = ["io-std", "rt-multi-thread", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1.52", optional = true }

[dev-dependencies]
bs58 = "0.5"
ed25519-dalek = "2"
basis-protocol = { path = "../BasisRustServer/crates/basis-protocol" }
basis-transport = { path = "../BasisRustServer/crates/basis-transport" }
basis-server-core = { path = "../BasisRustServer/crates/basis-server-core" }
tempfile = "3"
