name: Rust PR checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      # The 0.38 quick-xml APIs here parse operator-controlled config/resource XML;
      # no NsReader parses network input. Keep these two exact advisories visible
      # as a narrow deferral until the separately owned config parsers can migrate.
      - name: Audit client dependencies
        run: cargo audit --file BasisRustClient/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      - name: Audit server dependencies
        run: cargo audit --file BasisRustServer/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  voice-benchmark-validation:
    name: Voice benchmark validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test all benchmark tools and PGO rejection guards
        run: python3 -B -m unittest discover -s scripts/perf -p 'test_*.py'

  client-windows:
    name: Client check, test, clippy (Windows)
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "BasisRustClient -> target, BasisRustServer -> target"
      - name: Check client workspace with default allocator
        run: cargo check --locked --manifest-path BasisRustClient/Cargo.toml --workspace --all-targets
      - name: Check client workspace without mimalloc
        run: cargo check --locked --manifest-path BasisRustClient/Cargo.toml --workspace --all-targets --no-default-features
      - name: Test client workspace
        run: cargo test --locked --manifest-path BasisRustClient/Cargo.toml --workspace
      - name: Lint client workspace
        run: cargo clippy --locked --manifest-path BasisRustClient/Cargo.toml --workspace --all-targets -- -D warnings

  client-linux:
    name: Client check, test, clippy (Linux)
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "BasisRustClient -> target, BasisRustServer -> target"
      - name: Check Linux client core and tests
        run: cargo check --locked --manifest-path BasisRustClient/Cargo.toml -p basis-client-core --all-targets
      - name: Test Linux client core
        run: cargo test --locked --manifest-path BasisRustClient/Cargo.toml -p basis-client-core
      - name: Lint Linux client core
        run: cargo clippy --locked --manifest-path BasisRustClient/Cargo.toml -p basis-client-core --all-targets -- -D warnings

  storage-windows:
    name: Storage persistence (Windows)
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "BasisRustClient -> target, BasisRustServer -> target"
      - name: Test atomic database replacement and failure recovery
        run: cargo test --locked --manifest-path BasisRustServer/Cargo.toml -p basis-server-storage

  sql-storage:
    name: Server SQL storage check, test, clippy
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: basis_test
          POSTGRES_PASSWORD: basis_test
          POSTGRES_DB: basis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U basis_test -d basis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BASIS_TEST_POSTGRES_URL: postgres://basis_test:basis_test@127.0.0.1:5432/basis_test
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "BasisRustClient -> target, BasisRustServer -> target"
      - name: Check SQL-enabled workspace
        run: cargo check --locked --manifest-path BasisRustServer/Cargo.toml --workspace --all-targets --features basis-server-console/sql-storage
      - name: Test SQL-enabled workspace and SQLite fallback
        run: cargo test --locked --manifest-path BasisRustServer/Cargo.toml --workspace --features basis-server-console/sql-storage
      - name: Test PostgreSQL accounting and concurrent quotas
        run: cargo test --locked --manifest-path BasisRustServer/Cargo.toml -p basis-server-storage --features sql-storage postgres_integration -- --ignored
      - name: Test PostgreSQL migration script
        run: |
          psql --version
          python3 -B -m unittest discover -s scripts/storage -p 'test_*.py'
      - name: Lint SQL-enabled workspace
        run: cargo clippy --locked --manifest-path BasisRustServer/Cargo.toml --workspace --all-targets --features basis-server-console/sql-storage -- -D warnings

  format:
    name: Rust format
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check server formatting
        run: cargo fmt --manifest-path BasisRustServer/Cargo.toml --all -- --check

      - name: Check client formatting
        run: cargo fmt --manifest-path BasisRustClient/Cargo.toml --all -- --check

  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server check, test, clippy
            manifest: BasisRustServer/Cargo.toml
            workspace: "true"
            features: ""
          - name: Server GPU feature check, test, clippy
            manifest: BasisRustServer/Cargo.toml
            workspace: "true"
            features: "--features basis-server-console/gpu"
          - name: Client check, test, clippy
            manifest: BasisRustClient/Cargo.toml
            workspace: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "BasisRustClient -> target, BasisRustServer -> target"

      - name: Cargo check
        if: matrix.workspace == 'false'
        run: cargo check --locked --manifest-path ${{ matrix.manifest }} --all-targets

      - name: Cargo check workspace
        if: matrix.workspace == 'true'
        run: cargo check --locked --manifest-path ${{ matrix.manifest }} --workspace --all-targets ${{ matrix.features }}

      - name: Cargo test
        if: matrix.workspace == 'false'
        run: cargo test --locked --manifest-path ${{ matrix.manifest }}

      - name: Cargo test workspace
        if: matrix.workspace == 'true'
        run: cargo test --locked --manifest-path ${{ matrix.manifest }} --workspace ${{ matrix.features }}

      - name: Cargo clippy
        if: matrix.workspace == 'false'
        run: cargo clippy --locked --manifest-path ${{ matrix.manifest }} --all-targets -- -D warnings

      - name: Cargo clippy workspace
        if: matrix.workspace == 'true'
        run: cargo clippy --locked --manifest-path ${{ matrix.manifest }} --workspace --all-targets ${{ matrix.features }} -- -D warnings
