name: Docker; Build & Push Server Image

# Publishes ghcr.io/toys0125/basisrust-server from the binaries already attached to a
# GitHub release, so no toolchain is needed to produce the image.
#
# Mirrors the shape of BasisVR/Basis .github/workflows/build-docker-server.yml (per-arch
# image, then a merged manifest) but exploits something that reference cannot: the
# Linux binaries are already cross-compiled per architecture by build.yml, and GitHub
# offers native arm64 runners. Each architecture is therefore built on its own native
# runner and no QEMU emulation is required.
#
# It consumes the static musl archives (BasisRust-linux-{x64,arm64}-musl.tar.gz). Those
# are server-only and are produced for exactly this purpose; the glibc archives remain
# the ones published for people running the server directly on Linux. Because the musl
# binaries are statically linked, the image runs on any libc and needs only alpine as a
# base, which is what keeps it near 22 MB instead of ~98 MB.
#
# The image definition itself lives in BasisRustServer/Dockerfile.

on:
  # release.yml calls this only after uploading the release assets.
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      latest:
        description: Also move the "latest" tag to this image
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (leave blank to use the newest release)
        required: false
        type: string
      latest:
        description: Also move the "latest" tag to this image
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-server-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/basisrust-server

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-24.04
    outputs:
      image_name: ${{ steps.release.outputs.image_name }}
      tag: ${{ steps.release.outputs.tag }}
      version_tag: ${{ steps.release.outputs.version_tag }}
      bare_tag: ${{ steps.release.outputs.bare_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      promote_latest: ${{ steps.release.outputs.promote_latest }}
    steps:
      - name: Resolve release tag and image tags
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail

          # Registry repository names must be lowercase, including the owner.
          echo "image_name=$(tr '[:upper:]' '[:lower:]' <<<"$IMAGE_NAME")" >> "$GITHUB_OUTPUT"

          tag="${INPUT_TAG:-${EVENT_TAG:-}}"
          if [ -z "$tag" ]; then
            echo "No tag given; falling back to the newest published release."
            # /releases/latest already excludes drafts and prereleases.
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          echo "Resolved release tag: $tag"

          meta="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag")"
          draft="$(jq -r .draft <<<"$meta")"
          prerelease="$(jq -r .prerelease <<<"$meta")"

          if [ "$draft" = "true" ]; then
            echo "::error::Release '$tag' is still a draft; a draft cannot be published."
            exit 1
          fi

          # Docker tags must be lowercase. This repo's release tags are inconsistent
          # (both 'V55_0.2.2' and 'v55_0.2.0' exist), so normalise rather than assume.
          version_tag="$(tr '[:upper:]' '[:lower:]' <<<"$tag")"
          bare_tag="${version_tag#v}"

          for candidate in "$version_tag" "$bare_tag"; do
            if ! printf '%s' "$candidate" | grep -Eq '^[a-z0-9_][a-z0-9._-]{0,127}$'; then
              echo "::error::Release tag '$tag' does not yield a usable Docker tag ('$candidate')."
              exit 1
            fi
          done

          # A caller's latest=true must never override the prerelease restriction.
          promote_latest=false
          if [ "$prerelease" != "true" ]; then
            promote_latest=true
          fi
          if [ "$prerelease" != "true" ] && [ -n "$INPUT_LATEST" ]; then
            promote_latest="$INPUT_LATEST"
          fi

          {
            echo "tag=$tag"
            echo "version_tag=$version_tag"
            echo "bare_tag=$bare_tag"
            echo "prerelease=$prerelease"
            echo "promote_latest=$promote_latest"
          } >> "$GITHUB_OUTPUT"

          echo "version_tag=$version_tag bare_tag=$bare_tag prerelease=$prerelease promote_latest=$promote_latest"

  build:
    name: Build & validate ${{ matrix.arch_suffix }} image
    needs: resolve
    env:
      IMAGE_NAME: ${{ needs.resolve.outputs.image_name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_suffix: amd64
            runner: ubuntu-24.04
            docker_platform: linux/amd64
            asset: BasisRust-linux-x64-musl.tar.gz
          - arch_suffix: arm64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
            asset: BasisRust-linux-arm64-musl.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify the release has the expected asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets --jq \
            '.assets[].name' | tee /dev/stderr | grep -qx "$ASSET"

      - name: Download and unpack release payload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p download unpacked BasisRustServer/.docker-artifacts
          gh release download "$RELEASE_TAG" --pattern "$ASSET" --dir download --clobber
          # build.yml stages the release archive as ./server/basis-server-console, but the
          # Dockerfile expects the binary directly inside ARTIFACT_DIR. Copying the
          # directory contents explicitly keeps this working regardless of how the local
          # tar treats --strip-components.
          tar -xzf "download/$ASSET" -C unpacked
          cp -a unpacked/server/. BasisRustServer/.docker-artifacts/
          test -x BasisRustServer/.docker-artifacts/basis-server-console
          file BasisRustServer/.docker-artifacts/basis-server-console

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version_tag }}

      # Upload only by digest. Public version/latest tags are assigned after BOTH
      # native architecture smoke tests pass in this matrix.
      - name: Build and push untagged ${{ matrix.docker_platform }} image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: build
        with:
          context: ./BasisRustServer
          # Native runner, so a single platform and no QEMU.
          platforms: ${{ matrix.docker_platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-${{ matrix.arch_suffix }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch_suffix }}
          build-args: |
            ARTIFACT_DIR=.docker-artifacts
            BUILD_VERSION=${{ needs.resolve.outputs.version_tag }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.release.published_at || '' }}

      - name: Smoke test on the native runner
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          docker pull --platform "${{ matrix.docker_platform }}" "$image"
          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker start "$cid" >/dev/null

          for attempt in $(seq 1 45); do
            state="$(docker inspect --format '{{.State.Status}}' "$cid")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$cid")"
            case "$health" in
              healthy)
                docker exec "$cid" sh -c 'test "$(id -u)" = 10001'
                docker exec "$cid" curl -fsS http://127.0.0.1:10666/health
                echo ""
                docker logs "$cid" 2>&1 | tail -n 20
                docker stop --time 8 "$cid" >/dev/null
                exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$cid")"
                if [ "$exit_code" != "0" ]; then
                  echo "::error::Container did not stop gracefully (exit $exit_code)"
                  docker logs "$cid" 2>&1 | tail -n 50
                  exit 1
                fi
                exit 0
                ;;
              unhealthy)
                echo "::error::Container became unhealthy"
                docker logs "$cid" 2>&1 | tail -n 50
                exit 1
                ;;
            esac
            if [ "$state" = "exited" ]; then
              echo "::error::Container exited before becoming healthy"
              docker logs "$cid" 2>&1 | tail -n 50
              exit 1
            fi
            sleep 2
          done

          echo "::error::Container never reported healthy"
          docker logs "$cid" 2>&1 | tail -n 50
          exit 1

      - name: Record validated image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${{ matrix.arch_suffix }}"

      - name: Upload validated digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-digest-${{ matrix.arch_suffix }}
          path: digests/${{ matrix.arch_suffix }}
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-arch manifest
    needs: [resolve, build]
    env:
      IMAGE_NAME: ${{ needs.resolve.outputs.image_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validated digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: server-digest-*
          path: digests
          merge-multiple: true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version_tag }}
            type=raw,value=${{ needs.resolve.outputs.bare_tag }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.promote_latest == 'true' }}
            type=sha,prefix=

      - name: Create multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          amd64="$(cat digests/amd64)"
          arm64="$(cat digests/arm64)"
          for digest in "$amd64" "$arm64"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          done
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Creating $tag from amd64 + arm64"
            docker buildx imagetools create \
              --tag "$tag" \
              "$image@$amd64" \
              "$image@$arm64"
            docker buildx imagetools create --prefer-index=false --tag "${tag}-amd64" "$image@$amd64"
            docker buildx imagetools create --prefer-index=false --tag "${tag}-arm64" "$image@$arm64"
          done <<< "$TAGS"

      - name: Summarise published tags
        run: |
          echo "Published to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:"
          echo "  ${{ needs.resolve.outputs.version_tag }} (release ${{ needs.resolve.outputs.tag }})"
          echo "  ${{ needs.resolve.outputs.bare_tag }}"
          [ "${{ needs.resolve.outputs.promote_latest }}" = "true" ] && echo "  latest" || echo "  latest (skipped: prerelease)"
