name: Cross-platform builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            id: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe_suffix: .exe
            archive: BasisRust-windows-x64.zip
          - name: Linux x64
            id: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""
            archive: BasisRust-linux-x64.tar.gz
          - name: Linux ARM64
            id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe_suffix: ""
            archive: BasisRust-linux-arm64.tar.gz
          - name: macOS ARM64
            id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            exe_suffix: ""
            archive: BasisRust-macos-arm64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build server
        run: cargo build --release --target ${{ matrix.target }} --manifest-path BasisRustServer/Cargo.toml -p basis-server-console

      - name: Build client
        run: cargo build --release --target ${{ matrix.target }} --manifest-path BasisRustClient/Cargo.toml

      - name: Stage package
        shell: bash
        run: |
          mkdir -p package/client package/server
          cp "BasisRustClient/target/${{ matrix.target }}/release/basis-rust-client${{ matrix.exe_suffix }}" package/client/
          cp "BasisRustServer/target/${{ matrix.target }}/release/basis-server-console${{ matrix.exe_suffix }}" package/server/
          cp BasisRustClient/Config.xml package/client/Config.xml
          cp BasisRustServer/Config.xml package/server/Config.xml
          cp README.md package/README.md

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath "${{ matrix.archive }}"

      - name: Package Unix build
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C package -czf "${{ matrix.archive }}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: basisrust-${{ matrix.id }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
