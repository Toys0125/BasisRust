name: Cross-platform builds

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            id: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe_suffix: .exe
            archive: BasisRust-windows-x64.zip
          - name: Linux x64
            id: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""
            archive: BasisRust-linux-x64.tar.gz
          - name: Linux ARM64
            id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe_suffix: ""
            archive: BasisRust-linux-arm64.tar.gz
          - name: macOS ARM64
            id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            exe_suffix: ""
            archive: BasisRust-macos-arm64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            BasisRustServer -> target
            BasisRustClient -> target
          key: ${{ matrix.target }}

      - name: Build server
        run: cargo build --release --target ${{ matrix.target }} --manifest-path BasisRustServer/Cargo.toml -p basis-server-console

      - name: Build client
        run: cargo build --release --target ${{ matrix.target }} --manifest-path BasisRustClient/Cargo.toml

      - name: Stage package
        shell: bash
        run: |
          mkdir -p package/client package/server
          cp "BasisRustClient/target/${{ matrix.target }}/release/basis-rust-client${{ matrix.exe_suffix }}" package/client/
          cp "BasisRustServer/target/${{ matrix.target }}/release/basis-server-console${{ matrix.exe_suffix }}" package/server/
          cp BasisRustClient/Config.xml package/client/Config.xml
          cp BasisRustServer/Config.xml package/server/Config.xml
          cp README.md package/README.md

      - name: Pretty-print packaged configs
        shell: bash
        run: |
          PYTHON=python3
          command -v "$PYTHON" >/dev/null || PYTHON=python
          "$PYTHON" - <<'PY'
          from pathlib import Path
          from xml.dom import minidom

          def strip_whitespace(node):
              for child in list(node.childNodes):
                  if child.nodeType == child.TEXT_NODE and not child.data.strip():
                      node.removeChild(child)
                  elif child.hasChildNodes():
                      strip_whitespace(child)

          for path in (
              Path("package/client/Config.xml"),
              Path("package/server/Config.xml"),
          ):
              document = minidom.parse(str(path))
              strip_whitespace(document)
              pretty = document.documentElement.toprettyxml(indent="  ", newl="\n")
              with path.open("w", encoding="utf-8", newline="\n") as output:
                  output.write(pretty)
                  if not pretty.endswith("\n"):
                      output.write("\n")

              formatted = path.read_text(encoding="utf-8")
              if "\n  <" not in formatted or not formatted.endswith("\n"):
                  raise SystemExit(f"{path} was not pretty-printed")
          PY

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath "${{ matrix.archive }}"

      - name: Package Unix build
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C package -czf "${{ matrix.archive }}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: basisrust-${{ matrix.id }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
