name: Cross-platform builds

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/server-pgo.yml'
      - 'scripts/perf/server_pgo.py'
      - 'scripts/perf/server_pgo_analysis.py'
      - 'scripts/perf/avatar_benchmark.py'
      - 'scripts/perf/tune-avatar-settings.py'
      - 'docs/performance/fixtures/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            id: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe_suffix: .exe
            archive: BasisRust-windows-x64.zip
          - name: Linux x64
            id: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""
            archive: BasisRust-linux-x64.tar.gz
          - name: Linux ARM64
            id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe_suffix: ""
            archive: BasisRust-linux-arm64.tar.gz
          # Static musl builds exist solely to feed the container image, so they ship
          # the server only. musl has no glibc dependency, which is what lets the image
          # run on any libc and shrink from ~98 MB to ~22 MB.
          - name: Linux x64 musl
            id: linux-x64-musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            exe_suffix: ""
            archive: BasisRust-linux-x64-musl.tar.gz
            musl: true
            server_only: true
          - name: Linux ARM64 musl
            id: linux-arm64-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            exe_suffix: ""
            archive: BasisRust-linux-arm64-musl.tar.gz
            musl: true
            server_only: true
          - name: macOS ARM64
            id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            exe_suffix: ""
            archive: BasisRust-macos-arm64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Install musl toolchain
        if: matrix.musl == true
        # musl-tools supplies the arch-correct musl-gcc on both runners
        # (x86_64-linux-musl-gcc / aarch64-linux-musl-gcc). Rust finds it automatically, so
        # no linker override is needed. The target's std/core component is installed by the
        # dtolnay/rust-toolchain step above; without it every crate fails with
        # "can't find crate for `core`".
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Train and qualify target-native PGO server
        shell: bash
        env:
          PGO_OUTPUT: ${{ runner.temp }}/server-pgo-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          PGO_TARGET: ${{ matrix.target }}
        run: |
          python -B scripts/perf/server_pgo.py \
            --output "$PGO_OUTPUT" --target "$PGO_TARGET" \
            --clients 300 --minimum-clients 100

      - name: Retain PGO validation summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pgo-validation-${{ matrix.id }}
          path: ${{ runner.temp }}/server-pgo-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}/PGO-VALIDATION.md
          if-no-files-found: warn

      - name: Retain failed-build and process logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pgo-failure-logs-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/server-pgo-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}/build-*.log
            ${{ runner.temp }}/server-pgo-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}/profile-*.log
            ${{ runner.temp }}/server-pgo-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}/clients-*/**/server.log
            ${{ runner.temp }}/server-pgo-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}/clients-*/**/client.log
          if-no-files-found: warn

      - name: Stage package
        shell: bash
        env:
          SERVER_ONLY: ${{ matrix.server_only || 'false' }}
          PGO_OUTPUT: ${{ runner.temp }}/server-pgo-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p package/server
          cp "$PGO_OUTPUT/release/basis-server-console${{ matrix.exe_suffix }}" package/server/
          cp "$PGO_OUTPUT/release/PGO-VALIDATION.md" package/server/PGO-VALIDATION.md
          cp BasisRustServer/Config.xml package/server/Config.xml
          cp README.md package/README.md
          if [ "$SERVER_ONLY" != "true" ]; then
            mkdir -p package/client
            cp "$PGO_OUTPUT/release/basis-rust-client${{ matrix.exe_suffix }}" package/client/
            cp BasisRustClient/Config.xml package/client/Config.xml
          fi

      - name: Pretty-print packaged configs
        shell: bash
        run: |
          PYTHON=python3
          command -v "$PYTHON" >/dev/null || PYTHON=python
          "$PYTHON" - <<'PY'
          from pathlib import Path
          from xml.dom import minidom

          def strip_whitespace(node):
              for child in list(node.childNodes):
                  if child.nodeType == child.TEXT_NODE and not child.data.strip():
                      node.removeChild(child)
                  elif child.hasChildNodes():
                      strip_whitespace(child)

          for path in (
              Path("package/client/Config.xml"),
              Path("package/server/Config.xml"),
          ):
              # Server-only archives (musl) have no client directory.
              if not path.exists():
                  continue
              document = minidom.parse(str(path))
              strip_whitespace(document)
              pretty = document.documentElement.toprettyxml(indent="  ", newl="\n")
              with path.open("w", encoding="utf-8", newline="\n") as output:
                  output.write(pretty)
                  if not pretty.endswith("\n"):
                      output.write("\n")

              formatted = path.read_text(encoding="utf-8")
              if "\n  <" not in formatted or not formatted.endswith("\n"):
                  raise SystemExit(f"{path} was not pretty-printed")
          PY

      - name: Hash final release package contents
        shell: bash
        run: |
          python - <<'PYHASH'
          import hashlib
          from pathlib import Path
          root = Path('package')
          rows = []
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  rows.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}\n')
          (root / 'SHA256SUMS').write_text(''.join(rows), encoding='utf-8')
          PYHASH

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath "${{ matrix.archive }}"

      - name: Package Unix build
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C package -czf "${{ matrix.archive }}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: basisrust-${{ matrix.id }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
