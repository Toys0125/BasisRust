name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to build and attach
        required: true
        type: string

permissions:
  contents: read

jobs:
  builds:
    name: PGO server and client builds
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  attach:
    name: Attach qualified PGO builds
    needs: builds
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: basisrust-*
          path: release-assets
          merge-multiple: true

      - name: Attach builds to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  docker:
    name: Publish server image
    needs: attach
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker-server.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
